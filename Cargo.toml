# Live Markets for the Braiins Deck, built against the SDK checkout in
# bmc-sdk/ (a submodule pinned to the SDK revision that the Deck's firmware
# 26.10.1 was built from).

[workspace]
resolver = "3"
members = ["live-markets"]
# The SDK's crates belong to the SDK's own workspace, whose shared
# dependency versions they inherit.
exclude = ["bmc-sdk"]

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
wildcard_imports = "allow" # Widgets import the SDK whole by design
# Drawing code names its values x, y, w, h.
many_single_char_names = "allow"
similar_names = "allow"

# Widgets are tiny wasm binaries, optimised for size like the official ones.
[profile.dev]
opt-level = "z"
lto = true
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# A proc macro builds at opt-level 0 whatever the profile says, and the SDK's
# asset macros do real work while expanding.
[profile.dev.package.bmc-render-macros]
opt-level = 3

[profile.release.package.bmc-render-macros]
opt-level = 3
